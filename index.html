<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06402B">
<meta name="description" content="App del contratista de la Alcaldía de Flandes: su contrato, sus datos y sus avisos.">
<title>Contratista · Alcaldía de Flandes</title>

<!-- Las fuentes del kit. base.css las NOMBRA (IBM Plex Sans y Sora) pero no
     las trae nadie: sin estas dos líneas, las siete apps caen a la fuente
     del sistema y pierden el carácter. display=swap para que el texto se
     vea desde el primer instante aunque la fuente llegue después. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-192.png">

<!-- El kit primero: base.css define los colores de los dos temas -->
<link rel="stylesheet" href="kit/base.css">
<link rel="stylesheet" href="kit/banner.css">
<link rel="stylesheet" href="kit/sesion.css">
<link rel="stylesheet" href="kit/esqueletos.css">
<link rel="stylesheet" href="kit/guardado.css">
<link rel="stylesheet" href="kit/fechas.css">
<link rel="stylesheet" href="kit/conexion.css">
<link rel="stylesheet" href="kit/instalar.css">
<link rel="stylesheet" href="kit/soporte.css">
<link rel="stylesheet" href="kit/antidoble.css">
<link rel="stylesheet" href="kit/creditos.css">
<link rel="stylesheet" href="kit/bienvenida.css">
<link rel="stylesheet" href="kit/adjuntos.css">
<link rel="stylesheet" href="kit/carrusel.css">
<link rel="stylesheet" href="kit/insights.css">
<link rel="stylesheet" href="kit/buzon.css">
<link rel="stylesheet" href="styles.css">

<!-- version.js antes que el kit: la pieza de versión lee APP_VERSION al
     cargarse, y el pie lo enseña junto a la firma. -->
<script src="version.js"></script>

<!-- marca.js SIEMPRE antes que kit.js: de ahí salen API_URL y el resto -->
<script src="marca.js"></script>
<script src="kit/kit.js"></script>
<script src="kit/version.js"></script>
<script src="kit/banner.js"></script>
<script src="kit/sesion.js"></script>
<script src="kit/esqueletos.js"></script>
<script src="kit/guardado.js"></script>
<!-- la rueda de fechas: la usa la vista de la cuenta para el periodo -->
<script src="kit/fechas.js"></script>
<script src="kit/conexion.js"></script>
<script src="kit/instalar.js"></script>
<script src="kit/soporte.js"></script>
<script src="kit/antidoble.js"></script>
<script src="kit/creditos.js"></script>
<script src="kit/avisos.js"></script>
<script src="kit/bienvenida.js"></script>
<script src="kit/adjuntos.js"></script>
<script src="kit/imagenes.js"></script>
<script src="kit/carrusel.js"></script>
<script src="kit/insights.js"></script>
<script src="kit/buzon.js"></script>
</head>

<body>
  <main id="app" class="app"></main>
  <!-- borrador.js y cuenta.js antes que app.js: app.js los enruta y espera
       que existan -->
  <script src="borrador.js"></script>
  <script src="cuenta.js"></script>
  <script src="app.js"></script>
</body>
</html>
